worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    upstream api {
        server api:8080;
    }

    upstream frontend {
        server frontend:80;
    }

    # Certbot's HTTP-01 challenge needs plain :80 on every domain, so all
    # three share one redirect-to-HTTPS server block.
    server {
        listen 80;
        server_name light-speed.invisigate.asia
                    light-speed-api.invisigate.asia
                    dynamic-access-light-speed.invisigate.asia;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Dashboard UI (static SPA build, served by the frontend container).
    server {
        listen 443 ssl;
        http2 on;
        server_name light-speed.invisigate.asia;

        ssl_certificate     /etc/letsencrypt/live/light-speed.invisigate.asia/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/light-speed.invisigate.asia/privkey.pem;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Full API surface — only the dashboard (CORS-restricted to the UI
    # origin) and admins are meant to talk to this host directly.
    server {
        listen 443 ssl;
        http2 on;
        server_name light-speed-api.invisigate.asia;

        ssl_certificate     /etc/letsencrypt/live/light-speed.invisigate.asia/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/light-speed.invisigate.asia/privkey.pem;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Dynamic access key resolution only — what Outline client apps hit via
    # ssconf:// links (PUBLIC_BASE_URL). Deliberately a separate hostname from
    # the API above so a shared ssconf:// link never reveals the admin API's
    # domain, and deliberately proxies only the dkey path so this
    # public/unauthenticated host can't reach anything else the API exposes.
    server {
        listen 443 ssl;
        http2 on;
        server_name dynamic-access-light-speed.invisigate.asia;

        ssl_certificate     /etc/letsencrypt/live/light-speed.invisigate.asia/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/light-speed.invisigate.asia/privkey.pem;

        location /api/v1/dkey/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }
}
