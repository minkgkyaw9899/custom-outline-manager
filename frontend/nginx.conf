worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Chat apps unfurl a shared link by fetching it with a non-JS bot — they
    # never run the SPA's router, so its client-side page title/description
    # never reaches them. Route known link-preview bots to a static page with
    # generic (not real-usage) meta tags instead of the SPA shell.
    map $http_user_agent $keystatus_fallback {
        default /_shell.html;
        ~*bot /share-preview.html;
        ~*facebookexternalhit /share-preview.html;
        ~*whatsapp /share-preview.html;
        ~*viber /share-preview.html;
        ~*skypeuripreview /share-preview.html;
        ~*embedly /share-preview.html;
        ~*iframely /share-preview.html;
        ~*outlook /share-preview.html;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        # The build never produces an index.html (TanStack Start's SPA
        # output is _shell.html), so nginx's implicit "index index.html"
        # default would never match — and worse, "/" always resolves as an
        # existing directory, which try_files treats as found before it
        # ever reaches the fallback param below. Point index at the real
        # shell file so root requests resolve correctly.
        index _shell.html;

        # Content-hashed filenames (Vite's default), safe to cache forever.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA shell: never cache, so a new deploy is picked up on next
        # navigation instead of serving a stale asset manifest.
        location = /_shell.html {
            add_header Cache-Control "no-cache";
        }

        # The shared access-key link: known link-preview bots get the static
        # preview page (see $keystatus_fallback above), everyone else gets
        # the normal SPA shell.
        location ~ ^/users/keys-status/ {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ $keystatus_fallback;
        }

        # TanStack Start (spa mode) prerenders "/" but every other client
        # route only exists once the JS router takes over, so anything not on
        # disk falls back to the shell.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /_shell.html;
        }
    }
}
