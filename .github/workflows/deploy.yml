name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/custom-outline-manager-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/custom-outline-manager-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=https://light-speed-api.invisigate.asia/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Trust the host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ vars.LIGHTSAIL_SSH_PORT || 22 }}" "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync deploy/ to the instance
        run: |
          rsync -az --delete --exclude '.env' \
            -e "ssh -p ${{ vars.LIGHTSAIL_SSH_PORT || 22 }}" \
            deploy/ "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ vars.DEPLOY_DIR || '/opt/outline-manager' }}/"

      - name: Write .env
        # Piped over stdin rather than interpolated into the ssh command
        # string, so nothing in the secret (quotes, $, etc.) needs escaping.
        # Telegram alerting is configured as separate secrets (rather than
        # folded into DEPLOY_ENV_FILE) so it can be set up without touching
        # the DB/JWT/SMTP blob; appended here, one KEY=value line each. Any
        # left unset resolves to an empty line, which docker-compose's
        # ${VAR:-} defaults treat the same as unset.
        run: |
          { printf '%s\n' "${{ secrets.DEPLOY_ENV_FILE }}"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            printf 'TELEGRAM_CHAT_ID=%s\n' "${{ secrets.TELEGRAM_CHAT_ID }}"
            printf 'TELEGRAM_ADMIN_USER_ID=%s\n' "${{ secrets.TELEGRAM_ADMIN_USER_ID }}"
            printf 'TELEGRAM_WEBHOOK_SECRET=%s\n' "${{ secrets.TELEGRAM_WEBHOOK_SECRET }}"
          } | ssh -p "${{ vars.LIGHTSAIL_SSH_PORT || 22 }}" "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
              "cat > '${{ vars.DEPLOY_DIR || '/opt/outline-manager' }}/.env'"

      - name: Pull images and restart
        run: |
          ssh -p "${{ vars.LIGHTSAIL_SSH_PORT || 22 }}" "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" "
            cd '${{ vars.DEPLOY_DIR || '/opt/outline-manager' }}' &&
            docker compose pull &&
            docker compose up -d --remove-orphans
          "

  tag-release:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every successful deploy to main gets its own tag: vMAJOR.MINOR.PATCH,
      # patch auto-incremented from whatever's currently the highest vX.Y.Z
      # tag. Bump MAJOR/MINOR by pushing a tag manually ahead of a deploy
      # (e.g. `git tag v1.0.0 && git push origin v1.0.0`) — the next deploy
      # then continues incrementing the patch from there.
      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git tag "$NEXT"
          git push origin "$NEXT"
          gh release create "$NEXT" --title "$NEXT" --generate-notes
